name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the tests. The official image has ltree as a contrib extension.
    # Trust auth lets the tests log in as the harness_app role, which has no password.
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      MASTRA_TELEMETRY_DISABLED: '1'
      HARNESS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Rule files and the lock, which only grows
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE:rules/rules.lock.json" 2>/dev/null; then
            git show "$BASE:rules/rules.lock.json" > "$RUNNER_TEMP/base.lock.json"
            npm run rules:check -- --base "$RUNNER_TEMP/base.lock.json"
          else
            npm run rules:check
          fi
